<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FashTech Studio — Yönetici Girişi</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 20px;
            background: #f1f5f9;
            color: #334155;
            font-family: Arial, sans-serif;
        }

        .login-card {
            width: 100%;
            max-width: 390px;
            padding: 32px;
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 20px;
            box-shadow: 0 12px 35px rgba(15, 23, 42, .08);
        }

        h1 {
            margin: 0 0 8px;
            font-size: 25px;
        }

        p {
            margin: 0 0 25px;
            color: #64748b;
            font-size: 14px;
            line-height: 1.5;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            font-size: 15px;
        }

        button {
            width: 100%;
            margin-top: 18px;
            padding: 12px;
            border: 0;
            border-radius: 10px;
            background: #334155;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .error {
            margin-bottom: 16px;
            padding: 10px;
            border-radius: 8px;
            background: #fef2f2;
            color: #b91c1c;
            font-size: 14px;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            color: #475569;
            font-size: 13px;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <main class="login-card">
        <h1>Yönetici Girişi</h1>
        <p>FashTech Studio müşteri kayıtlarını görüntülemek için giriş yapın.</p>

        {% if error %}
            <div class="error" role="alert">{{ error }}</div>
        {% endif %}

        <form method="POST" action="{{ url_for('pages.dashboard_login') }}">
            <input
                type="hidden"
                name="csrf_token"
                value="{{ csrf_token }}"
            >

            <label for="password">Yönetici şifresi</label>
            <input
                id="password"
                name="password"
                type="password"
                autocomplete="current-password"
                required
                autofocus
            >

            <button type="submit">Giriş Yap</button>
        </form>

        <a href="/">← Asistana dön</a>
    </main>
</body>
</html>
